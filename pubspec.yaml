name: drafting_the_hydrant_valve
description: "Municipal heritage catalog and hydraulic head-loss simulator for mid-19th-century cast-iron hydrant barrels and foot valves."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  flutter_staggered_grid_view: ^0.7.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#F3F4F1"
  adaptive_icon_foreground: "assets/images/icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F3F4F1"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    color: "#F3F4F1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
